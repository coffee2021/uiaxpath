name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 构建并校验打包产物
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: 干净环境安装 wheel 并导入
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -c "import sys, uiaxpath; print(sys.version.split()[0], uiaxpath.__version__, len(uiaxpath.__all__))"
